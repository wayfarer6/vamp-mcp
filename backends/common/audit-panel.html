<!doctype html>
<html lang="%%LANG%%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-%%NONCE%%'; script-src 'nonce-%%NONCE%%'"
    />
    <style nonce="%%NONCE%%">
      * {
        box-sizing: border-box;
      }
      body {
        font: var(--vscode-font-size)/1.5 var(--vscode-font-family);
        max-width: 1100px;
        margin: 20px auto;
        padding: 0 18px;
      }
      h1 {
        font-size: 1.6rem;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        gap: 12px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 4px;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 7px;
        color: var(--vscode-input-foreground);
        background: var(--vscode-input-background);
        border: 1px solid var(--vscode-input-border, var(--vscode-contrastBorder, GrayText));
        border-radius: 3px;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      :focus-visible {
        outline: 2px solid var(--vscode-focusBorder);
        outline-offset: 2px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        border-bottom: 1px solid var(--vscode-panel-border);
        padding: 8px 0;
        overflow-wrap: anywhere;
      }
      li button {
        text-align: left;
        width: 100%;
        background: transparent;
        color: var(--vscode-foreground);
        border: 0;
      }
      strong,
      small {
        display: block;
      }
      small,
      #coverage {
        color: var(--vscode-descriptionForeground);
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="title" data-ko="감사 기록">Audit log</h1>
    <p id="coverage"></p>
    <form id="filters">
      <label
        ><span data-ko="시작 · 현지 시간">From · local time</span
        ><input id="from" type="datetime-local" required /></label
      ><label
        ><span data-ko="종료 · 현지 시간">Until · local time</span
        ><input id="to" type="datetime-local" required
      /></label>
      <label
        ><span data-ko="활동 종류">Activity</span
        ><select id="category">
          <option value="" data-ko="전체">All</option>
          <option value="hypervisor" data-ko="원격 VM 도구">Remote VM tools</option>
          <option value="cli">CLI</option>
          <option value="gui">GUI RPA</option>
          <option value="mount" data-ko="볼륨 마운트">Volume mount</option>
          <option value="credential" data-ko="자격 증명">Credentials</option>
        </select></label
      >
      <label
        ><span data-ko="스크립트 이름 또는 UUID">Script name or UUID</span
        ><input id="script" list="scripts" /><datalist id="scripts"></datalist
      ></label>
      <label><span data-ko="에이전트 ID">Agent ID</span><input id="agent" maxlength="64" /></label>
      <button class="primary" data-ko="조회">Search</button
      ><button type="button" id="resetFilters" data-ko="최근 24시간으로 초기화">
        Reset to last 24 hours
      </button>
    </form>
    <button hidden id="back" data-ko="목록으로">Back to results</button>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="events"></ul>
    <button hidden id="more" data-ko="더 보기">Load more</button>
    <script nonce="%%NONCE%%">
      const api = acquireVsCodeApi(),
        ko = document.documentElement.lang === 'ko',
        $ = (id) => document.getElementById(id),
        tr = (a, b) => (ko ? a : b);
      if (ko)
        document.querySelectorAll('[data-ko]').forEach((el) => (el.textContent = el.dataset.ko));
      let snapshot,
        previousSnapshot,
        request = 0,
        next = null,
        active = null,
        query = {},
        previous = [],
        previousNext = null,
        focused = null;
      function local(d) {
        return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      }
      function reset() {
        const now = new Date();
        $('filters').reset();
        $('from').value = local(new Date(+now - 86400000));
        $('to').value = local(new Date(+now + 60000));
      }
      function send(append = false) {
        $('status').textContent = tr('조회 중…', 'Loading…');
        $('more').hidden = true;
        api.postMessage({
          id: ++request,
          type: active ? 'details' : 'query',
          filters: {
            ...(active ? { run_id: active } : query),
            ...(append ? { before: next, snapshot_seq: snapshot } : {})
          }
        });
      }
      function begin() {
        if (!$('filters').reportValidity()) return;
        const start = new Date($('from').value),
          end = new Date($('to').value);
        if (start >= end) {
          $('status').textContent = tr(
            '종료 시간을 시작 이후로 선택하세요.',
            'Choose an end time after the start.'
          );
          return;
        }
        const name = $('script').value.trim();
        query = {
          from: start.toISOString(),
          to: end.toISOString(),
          category: $('category').value,
          agent_id: $('agent').value.trim()
        };
        if (name)
          query[
            /^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i.test(name)
              ? 'script_id'
              : 'script_name'
          ] = name;
        previous = [];
        next = null;
        $('events').replaceChildren();
        send();
      }
      const states = {
        queued: ['접수', 'Queued'],
        requested: ['요청 기록 · 결과 대기', 'Requested · awaiting outcome'],
        verified: ['결과 검증 통과', 'Result verified'],
        completed_unverified: ['작업 종료 · 결과 미검증', 'Completed · result unchecked'],
        error: ['오류', 'Error'],
        failed: ['실패', 'Failed'],
        timed_out: ['시간 초과', 'Timed out'],
        resolved: ['필드 값 조회', 'Credential resolved'],
        delivered: ['대상에 전달', 'Delivered'],
        denied: ['거절', 'Denied'],
        copied: ['클립보드에 복사', 'Copied to clipboard'],
        revealed: ['표시 승인', 'Reveal approved']
      };
      function row(e) {
        const li = document.createElement('li'),
          el = document.createElement(active ? 'div' : 'button'),
          head = document.createElement('strong'),
          meta = document.createElement('small');
        const state = states[e.outcome];
        head.textContent = (e.script || e.action) + ' · ' + (state ? tr(...state) : e.outcome);
        const agent = e.agent_id
          ? e.agent_id +
            ' (' +
            (e.agent_basis === 'configured'
              ? tr('설정', 'configured')
              : e.agent_basis === 'process_session'
                ? tr('서버 세션', 'server session')
                : tr('클라이언트 신고', 'client-declared')) +
            ')'
          : tr('미지정', 'unattributed');
        meta.textContent =
          new Date(e.at).toLocaleString() +
          ' · ' +
          e.category +
          ' · ' +
          e.source +
          ' · ' +
          agent +
          (active ? ' · ' + e.action + ' · ' + e.run_id : '');
        el.append(head, meta);
        li.append(el);
        if (!active) {
          el.dataset.run = e.run_id;
          el.onclick = () => {
            focused = e.run_id;
            active = e.run_id;
            previousNext = next;
            previousSnapshot = snapshot;
            next = null;
            $('filters').hidden = true;
            $('back').hidden = false;
            $('events').replaceChildren();
            $('title').textContent = tr('실행 상세', 'Run details');
            $('back').focus();
            send();
          };
        }
        $('events').append(li);
      }
      function back() {
        ++request;
        active = null;
        next = previousNext;
        snapshot = previousSnapshot;
        $('filters').hidden = false;
        $('back').hidden = true;
        $('title').textContent = tr('감사 기록', 'Audit log');
        $('events').replaceChildren();
        previous.forEach(row);
        $('more').hidden = !next;
        $('status').textContent = tr('표시한 실행 수 ', 'Runs shown: ') + previous.length;
        Array.from(document.querySelectorAll('[data-run]'))
          .find((b) => b.dataset.run === focused)
          ?.focus();
      }
      $('back').onclick = back;
      document.onkeydown = (e) => {
        if (e.key === 'Escape' && active) back();
      };
      $('filters').onsubmit = (e) => {
        e.preventDefault();
        begin();
      };
      $('resetFilters').onclick = () => {
        reset();
        begin();
      };
      $('more').onclick = () => send(true);
      window.addEventListener('message', ({ data: m }) => {
        if (m.preset) {
          if (active) back();
          reset();
          $('script').value = m.preset.script_id;
          $('category').value = m.preset.category;
          begin();
          return;
        }
        if (m.id !== request) return;
        if (m.error) {
          $('status').textContent = m.error;
          return;
        }
        $('scripts').replaceChildren(
          ...m.names.map((s) => {
            const o = document.createElement('option');
            o.value = s.name;
            return o;
          })
        );
        const c = m.coverage;
        $('coverage').textContent =
          tr('로컬 프로필 ', 'Local profile ') +
          c.profile +
          ' · ' +
          tr('보존 30일', '30-day retention') +
          ' · ' +
          (c.latest_event
            ? tr('최근 기록 ', 'Last recorded ') + new Date(c.latest_event).toLocaleString()
            : tr('아직 기록 없음', 'No events recorded yet'));
        if (!active) previous.push(...m.events);
        m.events.forEach(row);
        next = m.next;
        snapshot = m.snapshot;
        $('more').hidden = !next;
        $('status').textContent = $('events').children.length
          ? active
            ? tr('최근 이벤트부터 표시', 'Newest events first')
            : tr('실행별 최근 이벤트', 'Latest matching event per run')
          : tr(
              '이 범위에 기록이 없습니다. 기간이나 필터를 변경하세요.',
              'No recorded events match. Try a different time range or filter.'
            );
      });
      api.postMessage({ type: 'ready' });
    </script>
  </body>
</html>
